spring.application.name=backend

# PostgreSQL datasource (adjust username/password if needed)
spring.datasource.url=jdbc:postgresql://localhost:5432/smart_metrolac
spring.datasource.username=postgres
spring.datasource.password=Redsaq11
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (we already manage schema manually via DATABASE_SETUP.txt)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# MQTT settings
mqtt.broker.url=tcp://localhost:1883
mqtt.client.id=smartmetrolac-backend
mqtt.topic=smartmetrolac/device01/telemetry

# JWT settings
jwt.secret=smartmetrolac-secret-key-must-be-at-least-32-characters-long
jwt.expiration.milliseconds=86400000


